# Linux CI — validates the CUDA 12.8 Docker / AppImage build path.
#
# Development flow:
#   feature branch → open PR against main → this job + Windows CI run
#   → fix until green → merge.
#
# Release packaging (upload to GitHub Release) stays in release-appimage.yml.

name: Linux Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      cuda_architectures:
        description: "CMake CUDA architectures passed to Docker build"
        required: false
        default: "60;61;70;75;80;86;89;90-virtual"

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Linux CUDA 12.8 AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      IMAGE_NAME: insightat-ci-cuda12.8
      OUTPUT_DIR: linux-ci-assets
      DEFAULT_CUDA_ARCHITECTURES: "60;61;70;75;80;86;89;90-virtual"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h

      - name: Set build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="ci-${GITHUB_SHA::12}-cuda12.8"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            cuda_architectures="${{ inputs.cuda_architectures }}"
          else
            cuda_architectures="${DEFAULT_CUDA_ARCHITECTURES}"
          fi
          {
            echo "version=${version}"
            echo "cuda_architectures=${cuda_architectures}"
          } >> "$GITHUB_OUTPUT"
          echo "Build version: ${version}"
          echo "CUDA architectures: ${cuda_architectures}"

      - name: Build Docker image
        run: |
          docker build \
            --progress=plain \
            --file Dockerfile.cuda12.8 \
            --build-arg CMAKE_CUDA_ARCHITECTURES="${{ steps.meta.outputs.cuda_architectures }}" \
            --build-arg INSIGHTAT_VERSION="${{ steps.meta.outputs.version }}" \
            --tag "${IMAGE_NAME}:${{ steps.meta.outputs.version }}" \
            .

      - name: Extract AppImage artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${OUTPUT_DIR}"
          container_id="$(docker create "${IMAGE_NAME}:${{ steps.meta.outputs.version }}")"
          trap 'docker rm -f "${container_id}" >/dev/null 2>&1 || true' EXIT
          docker cp "${container_id}:/workspace/insightat/build-appimage-cuda12.8/." "${OUTPUT_DIR}/"
          find "${OUTPUT_DIR}" -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.sha256' \) -print
          test -n "$(find "${OUTPUT_DIR}" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InsightAT-linux-cuda12.8-${{ github.sha }}
          path: |
            ${{ env.OUTPUT_DIR }}/*.AppImage
            ${{ env.OUTPUT_DIR }}/*.sha256
          if-no-files-found: error
          retention-days: 14
