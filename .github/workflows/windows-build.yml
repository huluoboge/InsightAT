name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    
    strategy:
      matrix:
        include:
          - cuda: "12.8"
            visual-studio: "2022"

    env:
      VCPKG_ROOT: C:/vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_FEATURE_FLAGS: manifests,versions,binarycaching
      VCPKG_DEFAULT_BINARY_CACHE: C:/vcpkg/binary-cache
            
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Install CUDA through a GitHub Actions-aware installer. The runner
      # has no NVIDIA GPU, but nvcc can still compile CUDA translation units.
      - name: Install CUDA Toolkit
        id: cuda-toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.8.0'
          # The local-cache mode has repeatedly stalled on hosted runners.
          # Network mode can use the GitHub cache while falling back to the
          # installer, and the verification step below checks nvcc explicitly.
          method: network
          sub-packages: '["nvcc", "visual_studio_integration"]'
          use-github-cache: true
          use-local-cache: true
          log-file-suffix: 'windows-${{ matrix.cuda }}.txt'

      - name: Verify CUDA Toolkit
        shell: pwsh
        run: |
          $cuda_path = "${{ steps.cuda-toolkit.outputs.CUDA_PATH }}"
          if (-not $cuda_path) {
            $cuda_path = $env:CUDA_PATH
          }
          $cuda_path = @(
            $cuda_path,
            "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8",
            "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.6"
          ) | Where-Object { $_ -and (Test-Path (Join-Path $_ "bin\nvcc.exe")) } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($cuda_path)) {
            Write-Error "A CUDA toolkit with nvcc.exe was not found"
            exit 1
          }
          $nvcc_path = Join-Path $cuda_path "bin\nvcc.exe"
          if (-not (Test-Path $nvcc_path)) {
            Write-Error "nvcc.exe not found at $nvcc_path"
            exit 1
          }
          Write-Host "Using CUDA toolkit: $cuda_path"
          Write-Host "Using nvcc: $nvcc_path"
          & $nvcc_path --version
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $cuda_path "bin")
          Add-Content -Path $env:GITHUB_ENV -Value "CUDA_PATH=$cuda_path"
          Add-Content -Path $env:GITHUB_ENV -Value "CUDA_BIN_PATH=$(Join-Path $cuda_path 'bin')"

      # 2. 安装 Visual Studio Build Tools（如果需要）
      - name: Setup Visual Studio
        uses: microsoft/setup-msbuild@v1
        with:
          vs-version: '17'

      # 检查磁盘空间
      - name: Check disk space
        run: |
          Write-Host "Initial disk space:"
          Get-PSDrive C | Select-Object Name, @{label='Used(GB)';expression={[math]::Round($_.Used/1GB,2)}}, @{label='Free(GB)';expression={[math]::Round($_.Free/1GB,2)}}
          
          $free_gb = (Get-PSDrive C).Free / 1GB
          if ($free_gb -lt 8) {
            Write-Error "Insufficient disk space: ${free_gb}GB free. Need at least 8GB"
            exit 1
          }
          Write-Host "Disk space OK: ${free_gb}GB available"
        shell: pwsh

      # 3. Pin vcpkg to the baseline declared in vcpkg-configuration.json.
      - name: Pin vcpkg baseline
        shell: pwsh
        run: |
          $config = Get-Content -Raw vcpkg-configuration.json | ConvertFrom-Json
          $baseline = $config.'default-registry'.baseline
          Write-Host "Using vcpkg baseline: $baseline"

          if (Test-Path "$env:VCPKG_ROOT/.git") {
            git -C "$env:VCPKG_ROOT" fetch --depth=1 https://github.com/microsoft/vcpkg.git $baseline
            git -C "$env:VCPKG_ROOT" checkout --detach $baseline
          } else {
            Remove-Item "$env:VCPKG_ROOT" -Recurse -Force -ErrorAction SilentlyContinue
            git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
            git -C "$env:VCPKG_ROOT" fetch --depth=1 origin $baseline
            git -C "$env:VCPKG_ROOT" checkout --detach $baseline
          }

          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics

          & "$env:VCPKG_ROOT/vcpkg.exe" version

      # 4. Cache manifest dependencies. The manifest and baseline hashes are part
      # of the key, so changing either invalidates the installed package set.
      - name: Setup vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/downloads
            C:/vcpkg/binary-cache
          key: ${{ runner.os }}-vcpkg-manifest-${{ matrix.cuda }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-manifest-${{ matrix.cuda }}-

      - name: Install vcpkg manifest dependencies
        run: |
          $env:VCPKG_DISABLE_METRICS = "1"
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_ROOT/vcpkg.exe" install `
            --x-manifest-root="$env:GITHUB_WORKSPACE" `
            --triplet="$env:VCPKG_DEFAULT_TRIPLET" `
            --clean-after-build
          if ($LASTEXITCODE -ne 0) {
            Write-Error "vcpkg install failed"
            exit 1
          }
          & "$env:VCPKG_ROOT/vcpkg.exe" list
        shell: pwsh

      # 5. Configure CMake with the vcpkg manifest toolchain and separately
      # installed CUDA toolkit.
      - name: Configure CMake
        run: |
          $cuda_path = $env:CUDA_PATH
          $nvcc_path = "$cuda_path\bin\nvcc.exe"
          
          if (-Not (Test-Path $nvcc_path)) {
            Write-Error "nvcc.exe not found at $nvcc_path"
            exit 1
          }
          
          Write-Host "Configuring CMake with CUDA support..."
          Write-Host "CUDA path: $cuda_path"
          Write-Host "NVCC path: $nvcc_path"
          
          cmake -B build -S . `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="$env:VCPKG_DEFAULT_TRIPLET" `
            -DVCPKG_MANIFEST_MODE=ON `
            -DVCPKG_MANIFEST_DIR="$env:GITHUB_WORKSPACE" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CUDA_COMPILER="$nvcc_path" `
            -DCUDAToolkit_ROOT="$cuda_path" `
            -DCMAKE_CUDA_ARCHITECTURES="60-virtual;61-virtual;70-virtual;75-virtual;80-virtual;86-virtual;89-virtual;90-virtual;120-virtual" `
            -DINSIGHTAT_BUILD_RENDER_TESTS=OFF `
            -DSIFTGPU_ENABLE_CUDA=OFF `
            -DINSIGHTAT_ENABLE_SIFTGPU=OFF
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "CMake configuration failed"
            exit 1
          }
          Write-Host "CMake configured successfully"
        shell: pwsh

      # 6. Build
      - name: Build
        run: |
          Write-Host "Starting build..."
          cmake --build build --config Release --verbose -j 4
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build failed"
            exit 1
          }
          Write-Host "Build completed successfully"
        shell: pwsh

      # Keep the artifact self-contained enough to run on a clean Windows
      # machine. The C++ build itself remains in build/Release; this staging
      # directory is only for the downloadable CI artifact.
      - name: Stage Windows runtime package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release_dir = Join-Path $env:GITHUB_WORKSPACE "build\Release"
          $stage_dir = Join-Path $env:GITHUB_WORKSPACE "windows-package"
          if (-not (Test-Path $release_dir)) {
            Write-Error "Release output directory not found: $release_dir"
            exit 1
          }

          $required = @(
            "InsightAT.exe",
            "isat_project.exe",
            "isat_sfm.exe",
            "isat_extract.exe",
            "isat_match.exe",
            "at_bundler_viewer.exe"
          )
          foreach ($name in $required) {
            $path = Join-Path $release_dir $name
            if (-not (Test-Path $path)) {
              Write-Error "Required Windows executable was not built: $path"
              exit 1
            }
          }

          Remove-Item $stage_dir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage_dir | Out-Null
          Copy-Item (Join-Path $release_dir "*.exe") $stage_dir -Force
          Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE "build") -Recurse -Filter "*.dll" -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination $stage_dir -Force -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "data") (Join-Path $stage_dir "data") -Recurse -Force

          $triplet_bin = Join-Path $env:VCPKG_ROOT "installed\$env:VCPKG_DEFAULT_TRIPLET\bin"
          if (Test-Path $triplet_bin) {
            Copy-Item (Join-Path $triplet_bin "*.dll") $stage_dir -Force -ErrorAction SilentlyContinue
          }

          $cuda_bin = Join-Path $env:CUDA_PATH "bin"
          Copy-Item (Join-Path $cuda_bin "cudart64_*.dll") $stage_dir -Force -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $cuda_bin "cublas64_*.dll") $stage_dir -Force -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $cuda_bin "cusolver64_*.dll") $stage_dir -Force -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $cuda_bin "cusparse64_*.dll") $stage_dir -Force -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $cuda_bin "cufft64_*.dll") $stage_dir -Force -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $cuda_bin "cublasLt64_*.dll") $stage_dir -Force -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $cuda_bin "nvJitLink_*.dll") $stage_dir -Force -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $cuda_bin "nvrtc64_*.dll") $stage_dir -Force -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $cuda_bin "nvrtc-builtins64_*.dll") $stage_dir -Force -ErrorAction SilentlyContinue

          $windeployqt = Get-ChildItem -Path (Join-Path $env:VCPKG_ROOT "installed\$env:VCPKG_DEFAULT_TRIPLET") -Filter windeployqt.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -ne $windeployqt) {
            foreach ($gui in @("InsightAT.exe", "at_bundler_viewer.exe")) {
              $gui_path = Join-Path $stage_dir $gui
              if (Test-Path $gui_path) {
                & $windeployqt.FullName --release --no-translations $gui_path
              }
            }
          } else {
            Write-Warning "windeployqt.exe was not found; Qt DLLs must be supplied by the vcpkg runtime set."
          }

          @{
            project = "InsightAT"
            cuda = $env:CUDA_PATH
            triplet = $env:VCPKG_DEFAULT_TRIPLET
            commit = $env:GITHUB_SHA
          } | ConvertTo-Json | Set-Content (Join-Path $stage_dir "build-info.json")

          & (Join-Path $stage_dir "isat_project.exe") create -h
          if ($LASTEXITCODE -ne 0) {
            Write-Error "isat_project.exe create -h smoke test failed"
            exit 1
          }

          $zip_path = Join-Path $env:GITHUB_WORKSPACE "InsightAT-Windows-cuda${{ matrix.cuda }}-${{ github.sha }}.zip"
          Compress-Archive -Path (Join-Path $stage_dir "*") -DestinationPath $zip_path -CompressionLevel Optimal -Force

      # 7. Clean temporary vcpkg build trees, but keep installed packages for
      # cache save.
      - name: Cleanup temporary files
        if: always()
        run: |
          Write-Host "Cleaning up temporary files..."
          # 删除 vcpkg 源码和编译产物（已安装在 installed 目录）
          Remove-Item -Path "$env:VCPKG_ROOT/buildtrees" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$env:VCPKG_ROOT/packages" -Recurse -Force -ErrorAction SilentlyContinue
          
          Write-Host "Disk space after cleanup:"
          Get-PSDrive C | Select-Object Name, @{label='Used(GB)';expression={[math]::Round($_.Used/1GB,2)}}, @{label='Free(GB)';expression={[math]::Round($_.Free/1GB,2)}}
        shell: pwsh

      # 8. Run tests that do not require a real GPU. GitHub-hosted Windows
      # runners do not provide NVIDIA hardware.
      - name: Run tests
        run: |
          ctest --build-config Release --verbose -E "cuda|geo_ransac|opengl"
        working-directory: build
        shell: pwsh

      # 9. Upload a runnable Windows package and the raw build output.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: insightat-windows-cuda-${{ matrix.cuda }}
          path: |
            InsightAT-Windows-cuda${{ matrix.cuda }}-${{ github.sha }}.zip
            windows-package/**
            build/Release/*.exe
          retention-days: 30
