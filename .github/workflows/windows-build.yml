# Windows CI — vcpkg + MSVC Release build (CUDA optional / SiftGPU fallback).
#
# Triggers:
#   pull_request / push to main  → build + upload workflow artifacts
#   release (published)          → also upload zip to the GitHub Release
#                                 (Draft releases do NOT trigger this —
#                                  Publish as release or pre-release.)
#   workflow_dispatch            → manual build; optional tag to upload

name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload assets to; leave empty for artifacts only"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    strategy:
      matrix:
        include:
          - cuda: "12.8"
            visual-studio: "2022"

    env:
      VCPKG_ROOT: C:/vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows-release
      VCPKG_INSTALLED_DIR: C:/vcpkg/installed
      VCPKG_FEATURE_FLAGS: manifests,versions,binarycaching
      VCPKG_DEFAULT_BINARY_CACHE: C:/vcpkg/binary-cache

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          cuda="${{ matrix.cuda }}"

          if [[ "${{ github.event_name }}" == "release" ]]; then
            tag="${{ github.event.release.tag_name }}"
            upload_assets="true"
            version="${tag#v}-cuda${cuda}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
            if [[ -n "$tag" ]]; then
              upload_assets="true"
              version="${tag#v}-cuda${cuda}"
            else
              tag="${GITHUB_REF_NAME:-manual}"
              upload_assets="false"
              version="ci-${GITHUB_SHA::12}-cuda${cuda}"
            fi
          else
            tag=""
            upload_assets="false"
            version="ci-${GITHUB_SHA::12}-cuda${cuda}"
          fi

          zip_name="InsightAT-Windows-${version}.zip"
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "upload_assets=${upload_assets}"
            echo "zip_name=${zip_name}"
          } >> "$GITHUB_OUTPUT"

          echo "Tag: ${tag:-"(none)"}"
          echo "Build version: ${version}"
          echo "Zip: ${zip_name}"
          echo "Upload release assets: ${upload_assets}"

      # GitHub-hosted Windows runners do not provide an NVIDIA GPU. Prefer a
      # preinstalled toolkit when present; otherwise build the portable
      # GLSL/SiftGPU path instead of installing a multi-gigabyte CUDA toolkit.
      - name: Detect preinstalled CUDA Toolkit
        id: detect-cuda
        shell: pwsh
        run: |
          $candidates = @(
            $env:CUDA_PATH,
            "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8",
            "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.6"
          ) | Where-Object { $_ -and (Test-Path (Join-Path $_ "bin\nvcc.exe")) } | Select-Object -First 1
          if ($candidates) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "found=true"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "path=$candidates"
            Add-Content -Path $env:GITHUB_ENV -Value "CUDA_PATH=$candidates"
            Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $candidates "bin")
            Write-Host "Using preinstalled CUDA toolkit: $candidates"
          } else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "found=false"
            Write-Host "No preinstalled CUDA toolkit found; using GLSL/SiftGPU fallback."
          }

      - name: Resolve CUDA build mode
        shell: pwsh
        run: |
          $cuda_path = @(
            $env:CUDA_PATH,
            "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8",
            "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.6"
          ) | Where-Object { $_ -and (Test-Path (Join-Path $_ "bin\nvcc.exe")) } | Select-Object -First 1
          if ($cuda_path) {
            $nvcc_path = Join-Path $cuda_path "bin\nvcc.exe"
            Add-Content -Path $env:GITHUB_ENV -Value "CUDA_PATH=$cuda_path"
            Add-Content -Path $env:GITHUB_ENV -Value "INSIGHTAT_WINDOWS_CUDA=ON"
            Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $cuda_path "bin")
            Write-Host "Using CUDA toolkit: $cuda_path"
            & $nvcc_path --version
          } else {
            Add-Content -Path $env:GITHUB_ENV -Value "INSIGHTAT_WINDOWS_CUDA=OFF"
            Write-Warning "CUDA toolkit is unavailable; building the Windows GLSL/SiftGPU fallback."
          }

      - name: Setup Visual Studio
        uses: microsoft/setup-msbuild@v1
        with:
          vs-version: '17'

      - name: Check disk space
        shell: pwsh
        run: |
          Write-Host "Initial disk space:"
          Get-PSDrive C | Select-Object Name, @{label='Used(GB)';expression={[math]::Round($_.Used/1GB,2)}}, @{label='Free(GB)';expression={[math]::Round($_.Free/1GB,2)}}
          $free_gb = (Get-PSDrive C).Free / 1GB
          if ($free_gb -lt 8) {
            Write-Error "Insufficient disk space: ${free_gb}GB free. Need at least 8GB"
            exit 1
          }
          Write-Host "Disk space OK: ${free_gb}GB available"

      - name: Pin vcpkg baseline
        shell: pwsh
        run: |
          $config = Get-Content -Raw vcpkg-configuration.json | ConvertFrom-Json
          $baseline = $config.'default-registry'.baseline
          Write-Host "Using vcpkg baseline: $baseline"

          if (Test-Path "$env:VCPKG_ROOT/.git") {
            git -C "$env:VCPKG_ROOT" fetch --depth=1 https://github.com/microsoft/vcpkg.git $baseline
            git -C "$env:VCPKG_ROOT" checkout --detach $baseline
          } else {
            Remove-Item "$env:VCPKG_ROOT" -Recurse -Force -ErrorAction SilentlyContinue
            git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
            git -C "$env:VCPKG_ROOT" fetch --depth=1 origin $baseline
            git -C "$env:VCPKG_ROOT" checkout --detach $baseline
          }

          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          & "$env:VCPKG_ROOT/vcpkg.exe" version

      - name: Setup vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/downloads
            C:/vcpkg/binary-cache
          key: ${{ runner.os }}-vcpkg-manifest-${{ matrix.cuda }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/x64-windows-release.cmake') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-manifest-${{ matrix.cuda }}-
          save-always: true

      - name: Install vcpkg manifest dependencies
        timeout-minutes: 180
        shell: pwsh
        run: |
          $env:VCPKG_DISABLE_METRICS = "1"
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_ROOT/vcpkg.exe" install `
            --x-manifest-root="$env:GITHUB_WORKSPACE" `
            --x-install-root="$env:VCPKG_INSTALLED_DIR" `
            --overlay-triplets="$env:GITHUB_WORKSPACE/triplets" `
            --triplet="$env:VCPKG_DEFAULT_TRIPLET" `
            --clean-after-build
          if ($LASTEXITCODE -ne 0) {
            Write-Error "vcpkg install failed"
            exit 1
          }
          & "$env:VCPKG_ROOT/vcpkg.exe" list

      - name: Configure CMake
        shell: pwsh
        run: |
          $cuda_path = $env:CUDA_PATH
          $cuda_enabled = $env:INSIGHTAT_WINDOWS_CUDA -eq "ON"
          $cmake_args = @(
            "-B", "build",
            "-S", ".",
            "-G", "Visual Studio 17 2022",
            "-A", "x64",
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake",
            "-DVCPKG_TARGET_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET",
            "-DVCPKG_INSTALLED_DIR=$env:VCPKG_INSTALLED_DIR",
            "-DVCPKG_OVERLAY_TRIPLETS=$env:GITHUB_WORKSPACE/triplets",
            "-DVCPKG_MANIFEST_MODE=ON",
            "-DVCPKG_MANIFEST_DIR=$env:GITHUB_WORKSPACE",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DINSIGHTAT_BUILD_QT_UI=OFF",
            "-DINSIGHTAT_BUILD_RENDER_TESTS=OFF"
          )
          if ($cuda_enabled) {
            $nvcc_path = Join-Path $cuda_path "bin\nvcc.exe"
            if (-not (Test-Path $nvcc_path)) {
              Write-Error "CUDA mode was selected but nvcc.exe was not found at $nvcc_path"
              exit 1
            }
            $cmake_args += @(
              "-DCMAKE_CUDA_COMPILER=$nvcc_path",
              "-DCUDAToolkit_ROOT=$cuda_path",
              "-DCMAKE_CUDA_ARCHITECTURES=60-virtual;61-virtual;70-virtual;75-virtual;80-virtual;86-virtual;89-virtual;90-virtual;120-virtual",
              "-DSIFTGPU_ENABLE_CUDA=ON",
              "-DINSIGHTAT_ENABLE_SIFTGPU=ON"
            )
          } else {
            Write-Host "Configuring the Windows GLSL/SiftGPU fallback without CUDA."
            $cmake_args += @(
              "-DCMAKE_DISABLE_FIND_PACKAGE_CUDAToolkit=TRUE",
              "-DSIFTGPU_ENABLE_CUDA=OFF",
              "-DINSIGHTAT_ENABLE_SIFTGPU=ON"
            )
          }
          cmake @cmake_args
          if ($LASTEXITCODE -ne 0) {
            Write-Error "CMake configuration failed"
            exit 1
          }
          Write-Host "CMake configured successfully"

      - name: Build
        shell: pwsh
        run: |
          Write-Host "Starting build..."
          cmake --build build --config Release --verbose -j 4
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build failed"
            exit 1
          }
          Write-Host "Build completed successfully"

      - name: Stage Windows runtime package
        shell: pwsh
        run: |
          $env:INSIGHTAT_ZIP_NAME = "${{ steps.meta.outputs.zip_name }}"
          & "$env:GITHUB_WORKSPACE\packaging\windows\package.ps1"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Windows packaging failed"
            exit 1
          }

      - name: Cleanup temporary files
        if: always()
        shell: pwsh
        run: |
          Write-Host "Cleaning up temporary files..."
          Remove-Item -Path "$env:VCPKG_ROOT/buildtrees" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$env:VCPKG_ROOT/packages" -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Disk space after cleanup:"
          Get-PSDrive C | Select-Object Name, @{label='Used(GB)';expression={[math]::Round($_.Used/1GB,2)}}, @{label='Free(GB)';expression={[math]::Round($_.Free/1GB,2)}}

      - name: Run tests
        shell: pwsh
        working-directory: build
        run: |
          ctest --build-config Release --verbose -E "cuda|geo_ransac|opengl"

      - name: Hash release zip
        shell: bash
        run: |
          zip_name="${{ steps.meta.outputs.zip_name }}"
          test -f "${zip_name}"
          sha256sum "${zip_name}" | tee "${zip_name}.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: insightat-windows-cuda-${{ matrix.cuda }}-${{ github.sha }}
          path: |
            ${{ steps.meta.outputs.zip_name }}
            ${{ steps.meta.outputs.zip_name }}.sha256
            windows-package/**
          retention-days: 30

      - name: Upload assets to GitHub Release
        if: success() && steps.meta.outputs.upload_assets == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ steps.meta.outputs.tag }}" \
            "${{ steps.meta.outputs.zip_name }}" \
            "${{ steps.meta.outputs.zip_name }}.sha256" \
            --clobber
