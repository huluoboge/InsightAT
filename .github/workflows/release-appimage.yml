name: Release AppImage

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload assets to; leave empty to only build artifacts"
        required: false
        default: ""
      cuda_architectures:
        description: "CMake CUDA architectures passed to Docker build"
        required: false
        default: "60;61;70;75;80;86;89;90-virtual"

permissions:
  contents: write

jobs:
  build-linux-appimage:
    name: Build Linux AppImage CUDA 12.8
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      IMAGE_NAME: insightat-release-cuda12.8
      OUTPUT_DIR: release-assets
      DEFAULT_CUDA_ARCHITECTURES: "60;61;70;75;80;86;89;90-virtual"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h

      - name: Set release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "release" ]]; then
            tag="${{ github.event.release.tag_name }}"
            upload_assets="true"
          else
            tag="${{ inputs.tag }}"
            if [[ -n "$tag" ]]; then
              upload_assets="true"
            else
              tag="${GITHUB_REF_NAME:-manual}"
              upload_assets="false"
            fi
          fi

          version="${tag#v}-cuda12.8"
          cuda_architectures="${{ github.event.inputs.cuda_architectures || env.DEFAULT_CUDA_ARCHITECTURES }}"

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "upload_assets=${upload_assets}"
            echo "cuda_architectures=${cuda_architectures}"
          } >> "$GITHUB_OUTPUT"

          echo "Release tag: ${tag}"
          echo "Build version: ${version}"
          echo "Upload release assets: ${upload_assets}"
          echo "CUDA architectures: ${cuda_architectures}"

      - name: Build Docker image
        run: |
          docker build \
            --file Dockerfile.cuda12.8 \
            --build-arg CMAKE_CUDA_ARCHITECTURES="${{ steps.meta.outputs.cuda_architectures }}" \
            --build-arg INSIGHTAT_VERSION="${{ steps.meta.outputs.version }}" \
            --tag "${IMAGE_NAME}:${{ steps.meta.outputs.version }}" \
            .

      - name: Extract AppImage assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${OUTPUT_DIR}"
          container_id="$(docker create "${IMAGE_NAME}:${{ steps.meta.outputs.version }}")"
          trap 'docker rm -f "${container_id}" >/dev/null 2>&1 || true' EXIT

          docker cp "${container_id}:/workspace/insightat/build-appimage-cuda12.8/." "${OUTPUT_DIR}/"

          find "${OUTPUT_DIR}" -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.sha256' \) -print
          test -n "$(find "${OUTPUT_DIR}" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: InsightAT-linux-cuda12.8-${{ steps.meta.outputs.version }}
          path: |
            ${{ env.OUTPUT_DIR }}/*.AppImage
            ${{ env.OUTPUT_DIR }}/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload assets to GitHub Release
        if: steps.meta.outputs.upload_assets == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.meta.outputs.tag }}" \
            "${OUTPUT_DIR}"/*.AppImage \
            "${OUTPUT_DIR}"/*.sha256 \
            --clobber
