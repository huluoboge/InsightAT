# Electron GUI packaging (sfm-viewer + sfm-gui). Independent of CUDA CLI Docker build.
#
# Produces:
#   Linux: AppImage + deb (+ dir) under dist/sfm-viewer and dist/sfm-gui
#   Windows: zip under dist/sfm-viewer and dist/sfm-gui
#
# Triggers:
#   push/PR (path-filtered)      → build and validate packages
#   release (published)          → attach assets to the GitHub Release
#                                 (Draft releases do NOT trigger this —
#                                  Publish as release or pre-release.)
#   workflow_dispatch            → manual build; optional tag to upload

name: Electron GUI

on:
  push:
    branches: [ main ]
    paths:
      - 'sfm-gui/**'
      - 'sfm-viewer/**'
      - 'scripts/package/build_sfm_*.sh'
      - 'scripts/package/sync_electron_version.sh'
      - 'packaging/deb/package-all.sh'
      - 'VERSION'
      - '.github/workflows/electron-gui.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'sfm-gui/**'
      - 'sfm-viewer/**'
      - 'scripts/package/build_sfm_*.sh'
      - 'scripts/package/sync_electron_version.sh'
      - 'packaging/deb/package-all.sh'
      - 'VERSION'
      - '.github/workflows/electron-gui.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload assets to; leave empty for validation only"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: electron-gui-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: Resolve release upload
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      upload_assets: ${{ steps.meta.outputs.upload_assets }}
    steps:
      - name: Set metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "release" ]]; then
            tag="${{ github.event.release.tag_name }}"
            upload_assets="true"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
            if [[ -n "$tag" ]]; then
              upload_assets="true"
            else
              tag=""
              upload_assets="false"
            fi
          else
            tag=""
            upload_assets="false"
          fi
          {
            echo "tag=${tag}"
            echo "upload_assets=${upload_assets}"
          } >> "$GITHUB_OUTPUT"
          echo "Tag: ${tag:-"(none)"}"
          echo "Upload release assets: ${upload_assets}"

  linux:
    name: Linux AppImage + deb
    needs: meta
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            sfm-viewer/package-lock.json
            sfm-gui/package-lock.json
      - name: Package sfm-viewer
        run: |
          chmod +x scripts/package/build_sfm_viewer.sh
          ./scripts/package/build_sfm_viewer.sh linux-all
      - name: Package sfm-gui
        run: |
          chmod +x scripts/package/build_sfm_gui.sh
          ./scripts/package/build_sfm_gui.sh linux-all
      - name: Collect artifacts
        run: |
          mkdir -p electron-packages/linux
          find dist/sfm-viewer dist/sfm-gui -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.zip' \) -print -exec cp -a {} electron-packages/linux/ \;
          # Normalize to InsightAT-<component>-<ver>-linux-<arch>.<ext>
          # See packaging/RELEASE_ASSETS.md
          python3 - <<'PY'
          import pathlib, re
          root = pathlib.Path("electron-packages/linux")

          def rename(src: pathlib.Path, dest: pathlib.Path) -> None:
              if src.resolve() == dest.resolve():
                  return
              if dest.exists():
                  dest.unlink()
              print(f"rename {src.name} -> {dest.name}")
              src.replace(dest)

          patterns = [
              # Preferred electron-builder artifactName
              (r"^(InsightAT-(?:sfm-gui|sfm-viewer))-(\d[\w.-]*)-(linux|win)-(x64|amd64|x86_64)\.(AppImage|deb|zip)$",
               "preferred"),
              # Legacy / default electron-builder names
              (r"^InsightAT\.SfM\.Viewer-(\d[\w.-]*)\.AppImage$", "viewer-appimage"),
              (r"^InsightAT\.SfM-(\d[\w.-]*)\.AppImage$", "gui-appimage"),
              (r"^InsightAT\.SfM\.Viewer-(\d[\w.-]*)-win\.zip$", "viewer-win"),
              (r"^InsightAT\.SfM-(\d[\w.-]*)-win\.zip$", "gui-win"),
              (r"^insightat-sfm-viewer_(\d[\w.-]*)_amd64\.deb$", "viewer-deb"),
              (r"^insightat-sfm-gui_(\d[\w.-]*)_amd64\.deb$", "gui-deb"),
          ]

          for src in list(root.iterdir()):
              if not src.is_file() or src.name in {"SHA256SUMS"}:
                  continue
              name = src.name
              matched = False
              for pat, kind in patterns:
                  m = re.match(pat, name)
                  if not m:
                      continue
                  matched = True
                  if kind == "preferred":
                      component, version, os_name, arch, ext = m.groups()
                      os_name = "windows" if os_name == "win" else "linux"
                      if ext == "AppImage":
                          arch = "x86_64"
                      elif ext == "deb":
                          arch = "amd64"
                      else:
                          arch = "x64"
                          os_name = "windows"
                      dest = root / f"{component}-{version}-{os_name}-{arch}.{ext}"
                  elif kind == "viewer-appimage":
                      dest = root / f"InsightAT-sfm-viewer-{m.group(1)}-linux-x86_64.AppImage"
                  elif kind == "gui-appimage":
                      dest = root / f"InsightAT-sfm-gui-{m.group(1)}-linux-x86_64.AppImage"
                  elif kind == "viewer-win":
                      dest = root / f"InsightAT-sfm-viewer-{m.group(1)}-windows-x64.zip"
                  elif kind == "gui-win":
                      dest = root / f"InsightAT-sfm-gui-{m.group(1)}-windows-x64.zip"
                  elif kind == "viewer-deb":
                      dest = root / f"InsightAT-sfm-viewer-{m.group(1)}-linux-amd64.deb"
                  elif kind == "gui-deb":
                      dest = root / f"InsightAT-sfm-gui-{m.group(1)}-linux-amd64.deb"
                  else:
                      continue
                  rename(src, dest)
                  break
              if not matched:
                  print(f"skip unrecognized: {name}")
          PY
          chmod +x packaging/deb/package-all.sh
          DEB_OUTPUT_DIR=electron-packages/linux bash packaging/deb/package-all.sh
          (cd electron-packages/linux && sha256sum InsightAT-* > SHA256SUMS || true)
          ls -la electron-packages/linux
      # Package binaries are intentionally not stored as Actions artifacts due to quota.
      - name: Upload to GitHub Release
        if: needs.meta.outputs.upload_assets == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.meta.outputs.tag }}" electron-packages/linux/* --clobber

  windows:
    name: Windows zip
    needs: meta
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            sfm-viewer/package-lock.json
            sfm-gui/package-lock.json
      - name: Package sfm-viewer (win)
        shell: bash
        env:
          ELECTRON_GET_USE_PROXY: '0'
        run: |
          chmod +x scripts/package/build_sfm_viewer.sh scripts/package/sync_electron_version.sh
          ./scripts/package/build_sfm_viewer.sh win
      - name: Package sfm-gui (win)
        shell: bash
        env:
          ELECTRON_GET_USE_PROXY: '0'
        run: |
          chmod +x scripts/package/build_sfm_gui.sh scripts/package/sync_electron_version.sh
          ./scripts/package/build_sfm_gui.sh win
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p electron-packages/windows
          find dist/sfm-viewer dist/sfm-gui -type f -name '*.zip' -print -exec cp -a {} electron-packages/windows/ \;
          python3 - <<'PY'
          import pathlib, re
          root = pathlib.Path("electron-packages/windows")

          def rename(src: pathlib.Path, dest: pathlib.Path) -> None:
              if src.resolve() == dest.resolve():
                  return
              if dest.exists():
                  dest.unlink()
              print(f"rename {src.name} -> {dest.name}")
              src.replace(dest)

          patterns = [
              (r"^(InsightAT-(?:sfm-gui|sfm-viewer))-(\d[\w.-]*)-(?:win|windows)-(?:x64|amd64|x86_64)\.zip$", "preferred"),
              (r"^InsightAT\.SfM\.Viewer-(\d[\w.-]*)-win\.zip$", "viewer"),
              (r"^InsightAT\.SfM-(\d[\w.-]*)-win\.zip$", "gui"),
          ]
          for src in list(root.iterdir()):
              if not src.is_file() or src.name == "SHA256SUMS":
                  continue
              matched = False
              for pat, kind in patterns:
                  m = re.match(pat, src.name)
                  if not m:
                      continue
                  matched = True
                  if kind == "preferred":
                      dest = root / f"{m.group(1)}-{m.group(2)}-windows-x64.zip"
                  elif kind == "viewer":
                      dest = root / f"InsightAT-sfm-viewer-{m.group(1)}-windows-x64.zip"
                  else:
                      dest = root / f"InsightAT-sfm-gui-{m.group(1)}-windows-x64.zip"
                  rename(src, dest)
                  break
              if not matched:
                  print(f"skip unrecognized: {src.name}")
          PY
          (cd electron-packages/windows && sha256sum InsightAT-* > SHA256SUMS || true)
          ls -la electron-packages/windows
      - name: Upload to GitHub Release
        if: needs.meta.outputs.upload_assets == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ needs.meta.outputs.tag }}" electron-packages/windows/* --clobber
