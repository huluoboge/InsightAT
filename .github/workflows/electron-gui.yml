# Electron GUI packaging (sfm-viewer + sfm-gui). Independent of CUDA CLI Docker build.
#
# Produces:
#   Linux: AppImage + deb (+ dir) under dist/sfm-viewer and dist/sfm-gui
#   Windows: zip under dist/sfm-viewer and dist/sfm-gui
#
# Triggers:
#   push/PR (path-filtered)      → build and validate packages
#   release (published)          → attach assets to the GitHub Release
#                                 (Draft releases do NOT trigger this —
#                                  Publish as release or pre-release.)
#   workflow_dispatch            → manual build; optional tag to upload

name: Electron GUI

on:
  push:
    branches: [ main ]
    paths:
      - 'sfm-gui/**'
      - 'sfm-viewer/**'
      - 'scripts/package/build_sfm_*.sh'
      - 'scripts/package/sync_electron_version.sh'
      - 'VERSION'
      - '.github/workflows/electron-gui.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'sfm-gui/**'
      - 'sfm-viewer/**'
      - 'scripts/package/build_sfm_*.sh'
      - 'scripts/package/sync_electron_version.sh'
      - 'VERSION'
      - '.github/workflows/electron-gui.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload assets to; leave empty for validation only"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: electron-gui-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: Resolve release upload
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      upload_assets: ${{ steps.meta.outputs.upload_assets }}
    steps:
      - name: Set metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "release" ]]; then
            tag="${{ github.event.release.tag_name }}"
            upload_assets="true"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
            if [[ -n "$tag" ]]; then
              upload_assets="true"
            else
              tag=""
              upload_assets="false"
            fi
          else
            tag=""
            upload_assets="false"
          fi
          {
            echo "tag=${tag}"
            echo "upload_assets=${upload_assets}"
          } >> "$GITHUB_OUTPUT"
          echo "Tag: ${tag:-"(none)"}"
          echo "Upload release assets: ${upload_assets}"

  linux:
    name: Linux AppImage + deb
    needs: meta
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            sfm-viewer/package-lock.json
            sfm-gui/package-lock.json
      - name: Package sfm-viewer
        run: |
          chmod +x scripts/package/build_sfm_viewer.sh
          ./scripts/package/build_sfm_viewer.sh linux-all
      - name: Package sfm-gui
        run: |
          chmod +x scripts/package/build_sfm_gui.sh
          ./scripts/package/build_sfm_gui.sh linux-all
      - name: Collect artifacts
        run: |
          mkdir -p electron-packages/linux
          find dist/sfm-viewer dist/sfm-gui -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.zip' \) -print -exec cp -a {} electron-packages/linux/ \;
          (cd electron-packages/linux && sha256sum * > SHA256SUMS || true)
          ls -la electron-packages/linux
      # Package binaries are intentionally not stored as Actions artifacts due to quota.
      - name: Upload to GitHub Release
        if: needs.meta.outputs.upload_assets == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.meta.outputs.tag }}" electron-packages/linux/* --clobber

  windows:
    name: Windows zip
    needs: meta
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            sfm-viewer/package-lock.json
            sfm-gui/package-lock.json
      - name: Package sfm-viewer (win)
        shell: bash
        env:
          ELECTRON_GET_USE_PROXY: '0'
        run: |
          chmod +x scripts/package/build_sfm_viewer.sh scripts/package/sync_electron_version.sh
          ./scripts/package/build_sfm_viewer.sh win
      - name: Package sfm-gui (win)
        shell: bash
        env:
          ELECTRON_GET_USE_PROXY: '0'
        run: |
          chmod +x scripts/package/build_sfm_gui.sh scripts/package/sync_electron_version.sh
          ./scripts/package/build_sfm_gui.sh win
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p electron-packages/windows
          find dist/sfm-viewer dist/sfm-gui -type f -name '*.zip' -print -exec cp -a {} electron-packages/windows/ \;
          (cd electron-packages/windows && sha256sum * > SHA256SUMS || true)
          ls -la electron-packages/windows
      - name: Upload to GitHub Release
        if: needs.meta.outputs.upload_assets == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ needs.meta.outputs.tag }}" electron-packages/windows/* --clobber
