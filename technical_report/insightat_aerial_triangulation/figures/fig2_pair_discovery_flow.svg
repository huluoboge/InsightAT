   <g id="text_4">
    <text style="fill: #374151; font: 700 9.6px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="205.29" y="92.710174" transform="rotate(-0 205.29 92.710174)">是</text>
