   </g>
   <g id="text_9">
    <text style="fill: #111827; font: 9px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(94.284844 264.766421)">通道二 · 弱纹理补全：</text>
