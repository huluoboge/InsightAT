   <g id="text_5">
    <text style="fill: #111827; font: 9.4px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(430.802781 148.039375)">低分辨率关联：长边缩至 1024 像素、</text>
