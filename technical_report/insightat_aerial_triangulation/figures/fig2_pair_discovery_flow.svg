   </g>
   <g id="text_6">
    <text style="fill: #374151; font: 700 9.6px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="428.49" y="92.710174" transform="rotate(-0 428.49 92.710174)">否</text>
   </g>
   <g id="text_7">
    <text style="fill: #111827; font: 9.4px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(448.3 212.819809)">低分辨率几何验证：基础矩阵</text>
