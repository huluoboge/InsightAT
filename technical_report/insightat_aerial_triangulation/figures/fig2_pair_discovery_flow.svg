   </g>
   <g id="text_8">
    <text style="fill: #111827; font: 9px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(460.854844 273.837809)">通道一 · 邻居不足补全：</text>
