   <g id="text_3">
    <text style="fill: #111827; font: 9.4px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(79.44 150.630592)">直接生成全部</text>
