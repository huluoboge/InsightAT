   <g id="text_1">
    <text style="font: 700 13px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="330.84" y="26.604" transform="rotate(-0 330.84 26.604)">可逆逻辑删除与子集光束法平差</text>
   </g>
   <g id="text_2">
    <text style="fill: #111827; font: 8.8px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(198.84 60.892787)">完整轨迹存储：并查集一次建成，结构化数组布局，全程不物理搬移</text>
    <text style="fill: #111827; font: 8.8px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(146.04 71.731087)">轨迹四状态位｜存活・待重三角化・已三角化・本轮排除平差　　观测两状态位｜存活・可恢复</text>
   </g>
   <g id="text_3">
    <text style="fill: #111827; font: 8.8px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(96.71975 135.031137)">子集选择（注册数 &gt; 50 时逐轮重算）</text>
    <text style="fill: #111827; font: 8.8px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(94.22 145.169837)">每幅影像按自适应网格做非极大值抑制</text>
    <!-- 网格边长 $\lceil\sqrt{WH/1000}\,\rceil$，每格留最高分轨迹 -->
    <g style="fill: #111827" transform="translate(82.164 158.052487)">
     <text>
      <tspan style="font: 8.8px 'WenQuanYi Micro Hei'" x="0 8.796875 17.59375 26.390625 35.1875 94.392803 103.189678 111.986553 120.783428 129.580303 138.377178 147.174053 155.970928 164.767803" y="-0.20637499999999953">网格边长 ，每格留最高分轨迹</tspan>
      <tspan style="font: 8.8px 'DejaVu Sans'" x="37.472626 63.081476 66.045267 71.642099 77.238931 82.835764 90.960827" y="-0.20637499999999953 0.08125000000000071 0.08125000000000071 0.08125000000000071 0.08125000000000071 0.08125000000000071 -0.20637499999999953">⌈/1000⌉</tspan>
      <tspan style="font: 5.466154px 'STIXSizeOneSym'" x="40.904602" y="-1.0032499999999995">√</tspan>
      <tspan style="font: oblique 8.8px 'DejaVu Sans'" x="47.768564 56.466638" y="0.08125000000000071">WH</tspan>
     </text>
     <rect x="46.668564" y="-9.9" width="42.864032" height="0.55"/>
    </g>
    <!-- $\mathrm{score}=0.6\min(1,\deg/8)+0.4\sin^{2}\theta$ -->
    <g style="fill: #111827" transform="translate(91.316 169.456737)">
     <text>
      <tspan style="font: 8.8px 'DejaVu Sans'" x="0 4.58313 9.419693 14.801758 18.418442 25.544424 34.629086 40.225919 43.022183 48.619016 57.188229 59.632275 65.207639 68.639615 74.236447 78.746555 84.330508 89.742648 95.326602 97.915393 103.512225 108.658044 117.742706 123.339539 126.135803 131.732635 136.315765 138.759811" y="-0.059375000000001066">score=0.6min(1,deg/8)+0.4sin</tspan>
      <tspan style="font: 6.16px 'DejaVu Sans'" x="144.419393" y="-3.4281250000000014">2</tspan>
      <tspan style="font: oblique 8.8px 'DejaVu Sans'" x="150.006032" y="-0.059375000000001066">θ</tspan>
     </text>
    </g>
   </g>
   <g id="text_4">
    <text style="fill: #111827; font: 8.8px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(422.26 137.035887)">未入选轨迹：置「本轮排除平差」位</text>
    <text style="fill: #111827; font: 8.8px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(435.46 147.174587)">仅影响平差的点与观测集合，</text>
    <text style="fill: #111827; font: 8.8px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(422.26 157.313287)">不影响三角化、外点剔除与重三角化</text>
    <text style="fill: #111827; font: 8.8px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(403.069812 167.451987)">叠加规则：二度轨迹剪枝、每轨迹观测上限 12</text>
   </g>
   <g id="text_5">
    <text style="fill: #111827; font: 8.8px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(60.7855 239.599887)">① 入选集联合平差（解析雅可比 + Huber，δ = 4 像素）</text>
    <text style="fill: #111827; font: 8.8px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(84.276688 249.738587)">② 固定位姿，单独优化被排除轨迹的三维点</text>
    <text style="fill: #111827; font: 8.8px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(107.219938 259.877287)">③ 重投影 / 夹角 / 深度三类剔除</text>
    <text style="fill: #111827; font: 8.8px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(88.676688 270.015987)">④ 重三角化，恢复被判为内点的已删观测</text>
   </g>
   <g id="text_6">
    <text style="fill: #111827; font: 8.8px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(426.66 239.599887)">剔除的可恢复性由失败原因决定：</text>
    <text style="fill: #111827; font: 8.8px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(386.18825 249.738587)">残差超阈值 / 超深度 / 夹角不足 / 三角化外点 → 可恢复</text>
    <text style="fill: #111827; font: 8.8px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(385.716625 259.877287)">深度为负 / 初始像对非内点 / 姿态解算外点 → 不可恢复</text>
    <text style="fill: #111827; font: 8.8px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(376.819 270.015987)">恢复触发：某相机焦距相对变化 &gt; 2%，判据重投影 ≤ 4 像素</text>
   </g>
   <g id="text_7">
    <text style="fill: #2563eb; font: 8.8px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="330.84" y="318.7728" transform="rotate(-0 330.84 318.7728)">内参精化后回流：把早期误删的结构线索重新接上</text>
   </g>
   <g id="text_8">
    <text style="fill: #111827; font: 9px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(146.34 369.230766)">设计动机：冗余观测主要买鲁棒性而非信息量，故逐轮只取子集求解，在规模与质量间折中；</text>
    <text style="fill: #111827; font: 9px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(168.84 379.599891)">早期焦距与畸变不可靠时结构必然带偏差，因此一切剔除先做可逆标记而非硬删，</text>
    <text style="fill: #111827; font: 9px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(164.34 389.969016)">待内参随迭代变好再重新评估。轨迹存储因此完整保留了整个估计过程的最终状态。</text>
   </g>
  </g>
 </g>
