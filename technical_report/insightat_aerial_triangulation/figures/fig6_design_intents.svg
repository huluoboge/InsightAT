   </g>
   <g id="text_8">
    <text style="fill: #111827; font: 9.3px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(334.56 241.451058)">并发处理</text>
    <text style="fill: #111827; font: 9.3px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(320.61 252.16582)">独立进程批处理</text>
    <text style="fill: #111827; font: 9.3px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(320.61 262.880583)">异步读—算—写</text>
