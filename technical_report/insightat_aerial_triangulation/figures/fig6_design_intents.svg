   <g id="text_1">
    <text style="font: 700 13px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="353.16" y="26.604" transform="rotate(-0 353.16 26.604)">四项设计初衷 → 系统组织约束</text>
   </g>
   <g id="text_2">
    <text style="fill: #111827; font: 700 9px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(71.505 78.530203)">云端友好</text>
    <text style="fill: #111827; font: 700 9px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(62.505 88.899328)">无全局内存态</text>
    <text style="fill: #111827; font: 700 9px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(62.505 99.268453)">任务描述驱动</text>
    <text style="fill: #111827; font: 700 9px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(58.005 109.637578)">独立可执行程序</text>
   </g>
   <g id="text_3">
    <text style="fill: #111827; font: 700 9px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(238.275 78.530203)">傻瓜化自动化</text>
    <text style="fill: #111827; font: 700 9px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(233.775 88.899328)">少暴露算法开关</text>
    <text style="fill: #111827; font: 700 9px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(238.275 99.268453)">默认即可工作</text>
    <text style="fill: #111827; font: 700 9px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(233.775 109.637578)">配置只留给评测</text>
   </g>
   <g id="text_4">
    <text style="fill: #111827; font: 700 9px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(418.545 78.530203)">鲁棒性优先</text>
    <text style="fill: #111827; font: 700 9px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(405.045 88.899328)">增量式优于全局式</text>
    <text style="fill: #111827; font: 700 9px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(404.727891 99.268453)">多假设 + 试解取优</text>
    <text style="fill: #111827; font: 700 9px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(400.227891 109.637578)">可逆剔除 + 降级路径</text>
   </g>
   <g id="text_5">
    <text style="fill: #111827; font: 700 9px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(607.815 78.530203)">性能</text>
    <text style="fill: #111827; font: 700 9px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(568.480781 88.899328)">CUDA → GPGPU → CPU</text>
    <text style="fill: #111827; font: 700 9px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(586.601719 99.268453)">异步批处理 I/O</text>
    <text style="fill: #111827; font: 700 9px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(581.828906 109.637578)">SoA + 自描述容器</text>
   </g>
   <g id="text_6">
    <text style="font: 700 11.5px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="353.16" y="170.748" transform="rotate(-0 353.16 170.748)">每个处理环节的统一组织模式</text>
   </g>
   <g id="text_7">
    <text style="fill: #111827; font: 9.3px 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'DejaVu Sans', sans-serif" transform="translate(161.58 241.451058)">任务生成</text>
